<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RH 管线冒烟测试 · 班级管家</title>
</head>
<body>
  <pre id="out">【等待启动】</pre>

  <script src="../src/config.js"></script>
  <script src="../src/review/rules.js"></script>
  <script src="../src/review/tokenizer.js"></script>
  <script src="../src/review/newword.js"></script>
  <script src="../src/review/keywords.js"></script>
  <script src="../src/review/textrank.js"></script>
  <script src="../src/review/selection.js"></script>
  <script src="../src/review/semantic.js"></script>
  <script src="../src/review/sm2.js"></script>
  <script src="../src/review/storage.js"></script>
  <script src="../src/review/quiz.js"></script>
  <script src="../src/review/summarize.js"></script>
  <script src="../src/review/quizgen.js"></script>
  <script src="../src/review/llm.js"></script>
  <script src="../src/review/exporter.js"></script>
  <script src="../src/review/parsers.js"></script>
  <script src="../src/review/pipeline.js"></script>

  <script>
  (function () {
    var out = document.getElementById("out");
    var lines = [];
    function log(s) { lines.push(s); out.textContent = lines.join("\n"); }

    var TEXT = [
      "# 细胞呼吸与光合作用复习",
      "",
      "## 一、细胞呼吸",
      "细胞呼吸是指有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，同时释放能量并生成 ATP 的过程。",
      "有氧呼吸的第一阶段在细胞质基质中进行，一分子的葡萄糖分解成两分子的丙酮酸，并产生少量的还原型辅酶Ⅰ和少量的能量。",
      "有氧呼吸的第二阶段在线粒体基质中进行，丙酮酸和水彻底分解成二氧化碳和还原型辅酶Ⅰ，同时释放少量的能量。",
      "有氧呼吸的第三阶段在线粒体内膜上进行，前两个阶段产生的还原型辅酶Ⅰ与氧气结合生成水，同时释放大量的能量。",
      "无氧呼吸的场所是细胞质基质，人在剧烈运动时肌细胞会进行无氧呼吸，产生乳酸并释放少量能量。",
      "酵母菌在无氧条件下进行无氧呼吸，把葡萄糖分解为酒精和二氧化碳，这一过程被广泛用于酿酒和发面。",
      "",
      "## 二、光合作用",
      "光合作用是指绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存着能量的有机物，并且释放出氧气的过程。",
      "光合作用分为光反应阶段和暗反应阶段。光反应阶段的场所是类囊体薄膜，需要光、色素和多种酶参与。",
      "光反应阶段中，水在光下被分解成氧气和还原型辅酶Ⅱ，同时把光能转变为活跃的化学能储存在 ATP 中。",
      "暗反应阶段的场所是叶绿体基质，不需要光直接参与，但需要光反应提供的还原型辅酶Ⅱ和 ATP。",
      "暗反应阶段中，二氧化碳首先与五碳化合物结合生成三碳化合物，这一过程叫作二氧化碳的固定。",
      "三碳化合物在还原型辅酶Ⅱ和 ATP 的作用下被还原，最终生成糖类，同时五碳化合物得到再生。",
      "",
      "## 三、影响因素与实验",
      "光照强度会影响光合作用速率，在一定范围内光照越强，光合作用速率越快，超过一定值后不再增加。",
      "温度通过影响酶的活性来影响细胞呼吸和光合作用，温度过高会使酶变性失活，温度过低会使酶活性显著降低。",
      "二氧化碳浓度是影响光合作用的重要因素，适当提高二氧化碳浓度可以明显提高农作物的光合作用速率。",
      "探究酵母菌细胞呼吸方式的实验中，检测二氧化碳可用澄清石灰水或溴麝香草酚蓝水溶液，检测酒精可用酸性的重铬酸钾溶液。",
      "绿色植物的叶绿体中含有叶绿素和类胡萝卜素两类色素，其中叶绿素主要吸收红光和蓝紫光，类胡萝卜素主要吸收蓝紫光。"
    ].join("\n");

    try {
      if (!window.RH || !RH.parsers || !RH.pipeline) throw new Error("RH 模块未完整加载");
      if (!window.RH_CONFIG) throw new Error("RH_CONFIG 别名未生效");
      log("RH.llm.ready() = " + RH.llm.ready() + "  model=" + RH.llm.info().model);
      log("RH_CONFIG.llm.baseURL = " + (RH_CONFIG.llm && RH_CONFIG.llm.baseURL));
      log("---- 运行 RH.pipeline.run ----");

      var doc = RH.parsers.parseTxt(TEXT, "冒烟测试材料");
      var t0 = Date.now();
      RH.pipeline.run(doc, function (stage, msg, ratio) {
        log("[stage:" + stage + "] " + msg + "  (" + Math.round((ratio || 0) * 100) + "%)");
      }).then(function (vm) {
        var ms = Date.now() - t0;
        var firstQ = (vm.quiz && vm.quiz[0] && vm.quiz[0].question) || "";
        var result = {
          engine: vm.engine,
          overview长度: (vm.overview || "").length,
          sections数: (vm.sections || []).length,
          quiz数: (vm.quiz || []).length,
          keywords数: (vm.keywords || []).length,
          backend: vm.backend,
          首题题干: firstQ,
          耗时ms: ms
        };
        log("---- 结果 ----");
        log(JSON.stringify(result, null, 2));
        log("SMOKE_DONE engine=" + vm.engine + " quiz=" + (vm.quiz || []).length);
      }).catch(function (e) {
        log("SMOKE_ERROR " + (e && (e.stack || e.message) || e));
        log("SMOKE_DONE engine=error");
      });
    } catch (e) {
      log("SMOKE_ERROR " + (e && (e.stack || e.message) || e));
      log("SMOKE_DONE engine=error");
    }
  })();
  </script>
</body>
</html>
