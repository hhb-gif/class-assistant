<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视图集成冒烟测试（全角色 × 全视图）</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <!-- 复刻 index.html 骨架（id 与契约一致） -->
  <header id="topbar">
    <div id="brand">冒烟测试<span id="brand-sub">集成验证</span></div>
    <div id="topbar-right">
      <label id="ai-toggle-wrap"><input type="checkbox" id="ai-toggle"><span>AI 助手</span></label>
      <select id="role-switcher"></select>
    </div>
  </header>
  <nav id="tabbar">
    <button class="nav-item active" type="button" data-view="notices">通知</button>
    <button class="nav-item" type="button" data-view="scores">成绩</button>
    <button class="nav-item" type="button" data-view="collect">收集</button>
    <button class="nav-item" type="button" data-view="review">复习</button>
    <button class="nav-item" type="button" data-view="settings">设置</button>
  </nav>
  <main id="view-root"></main>
  <div id="toast"></div>
  <div id="modal-mask" hidden><div id="modal-box"></div></div>

  <pre id="out">RUNNING</pre>

  <script src="../src/config.js"></script>
  <script src="../src/llm.js"></script>
  <script src="../src/store.js"></script>
  <script src="../src/seed.js"></script>
  <script src="../src/auth.js"></script>
  <script src="../src/charts.js"></script>
  <script src="../src/ai.js"></script>
  <script src="../src/notices.js"></script>
  <script src="../src/scores.js"></script>
  <script src="../src/app.js"></script>

  <script>
    // app.js 的 switchView 内部会吞异常并渲染错误占位，故按占位文案判定失败
    window.addEventListener("load", function () {
      setTimeout(function () {
        var out = [];
        var views = ["notices", "scores", "collect", "review", "settings"];
        var users = CA.auth.list();
        var fail = 0, pass = 0;
        users.forEach(function (u) {
          CA.auth.switchTo(u.id);
          views.forEach(function (v) {
            var err = "";
            try { CA.app.switchView(v); } catch (e) { err = (e && e.message) || String(e); }
            var sec = document.getElementById("view-" + v);
            var html = sec ? sec.innerHTML : "";
            var bad = !!err || html.indexOf("模块加载出错") >= 0 || html.length < 20;
            if (bad) fail++; else pass++;
            out.push((bad ? "ERR  " : "OK   ") + u.name + "/" + v + " len=" + html.length + (err ? " " + err : ""));
          });
        });
        // 交互抽查：通知详情、发布表单开关、成绩单科切换
        try { CA.auth.switchTo(users[0].id); CA.app.switchView("notices"); } catch (e) { out.push("ERR interact " + e.message); }
        out.unshift("== 结果：通过 " + pass + " / 失败 " + fail + " ==");
        document.getElementById("out").textContent = out.join("\n");
      }, 300);
    });
  </script>
</body>
</html>
